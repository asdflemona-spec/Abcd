name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q MyPicksGalaxy_v3.zip -d android-project

      - name: Make Gradle executable
        run: chmod +x android-project/gradlew

      - name: Build APK
        working-directory: android-project
        run: ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPicksGalaxy-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
