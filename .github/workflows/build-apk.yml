name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q MyPicksGalaxy_v3.zip -d android-project
          echo "=== ZIP contents ==="
          find android-project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Project found at: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPicksGalaxy-APK
          path: android-project/**/*.apk
          if-no-files-found: error
