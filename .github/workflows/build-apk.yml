name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q MyPicksGalaxy.zip -d android-project

      - name: Patch project
        run: |
          PROJECT_DIR=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -1)
          echo "Project: $PROJECT_DIR"

          # Java/Kotlin 모두 JVM 17 사용
          find "$PROJECT_DIR" -name "*.gradle.kts" -type f -exec \
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +

          # Wikimedia가 //upload.wikimedia.org/... 형태 URL을 반환하는
          # 경우에도 HTTPS 이미지로 정상 표시되도록 보정
          find "$PROJECT_DIR/app/src" -name "*.kt" -type f -exec \
            sed -i 's#model = item.imageUrl#model = if (item.imageUrl.startsWith("//")) "https:" + item.imageUrl else item.imageUrl#g' {} + || true

          # 혹시 http URL이 있으면 https로 변경
          find "$PROJECT_DIR/app/src" -name "*.kt" -type f -exec \
            sed -i 's#"http://upload.wikimedia.org#"https://upload.wikimedia.org#g' {} + || true

          echo "=== Patched image references ==="
          grep -R "model =" "$PROJECT_DIR/app/src" || true

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -1)
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Collect APK
        run: |
          rm -rf apk-output
          mkdir apk-output
          find android-project -type f -name "*.apk" -exec cp {} apk-output/ \;
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPicksGalaxy-APK
          path: apk-output/*.apk
